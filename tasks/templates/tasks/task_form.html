{% extends 'tasks/base.html' %}
{% block title %}{{ action }} Task{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-4">{{ action }} Task</h2>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-500">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-dark">{{ action }} Task</button>
            <a href="{% url 'task-list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  input[type=text], input[type=date], select, textarea {
    display: block; width: 100%; padding: .5rem .75rem;
    border: 1px solid #dee2e6; border-radius: .375rem;
    font-size: .95rem; transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #212529; box-shadow: 0 0 0 3px rgba(33,37,41,.1);
  }
</style>
{% endblock %}
