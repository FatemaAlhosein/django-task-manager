{% extends 'tasks/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-4">Login</h2>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-dark w-100 mt-2">Login</button>
        </form>
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1" /><span class="px-2 text-muted small">or</span><hr class="flex-grow-1" />
        </div>
        <form method="post" action="{% url 'demo-login' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-dark w-100">
            ▶ Try Demo — no account needed
          </button>
        </form>
        <p class="text-center text-muted mt-3 mb-0 small">
          No account? <a href="{% url 'register' %}">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>

<style>
  input { display:block; width:100%; padding:.5rem .75rem; border:1px solid #dee2e6;
    border-radius:.375rem; font-size:.95rem; }
  input:focus { outline:none; border-color:#212529; box-shadow:0 0 0 3px rgba(33,37,41,.1); }
</style>
{% endblock %}
